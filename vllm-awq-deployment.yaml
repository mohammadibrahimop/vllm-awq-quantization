apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-awq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-awq
  template:
    metadata:
      labels:
        app: vllm-awq
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command:
        - vllm
        - serve
        - Qwen/Qwen2.5-7B-Instruct-AWQ
        - --host=0.0.0.0
        - --port=8000
        - --quantization=awq
        - --dtype=bfloat16
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.90
        - --max-model-len=4096
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache-pvc
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
